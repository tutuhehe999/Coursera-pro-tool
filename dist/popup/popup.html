<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coursera Pro Tool - Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="popup-header">
      <div class="popup-brand">
        <img src="../icons/icon-48.png" alt="" width="28" height="28">
        <div>
          <span class="popup-name">Coursera<span class="accent">Pro</span></span>
          <span class="popup-version">v3.0.0</span>
        </div>
      </div>
    </header>

    <section class="popup-section">
      <h2 class="section-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15v-3m0 0V9m0 3h3m-3 0H9"/><circle cx="12" cy="12" r="10"/></svg>
        AI Provider & Setup
      </h2>
      <div class="form-group">
        <label for="aiProvider">AI Provider</label>
        <select id="aiProvider">
          <option value="gemini">Google Gemini (Miễn phí & Nhanh)</option>
          <option value="deepseek">DeepSeek (V3 / R1 Suy luận toán)</option>
          <option value="groq">Groq (Siêu tốc ~500 tok/s, Miễn phí)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="apiKey" id="apiKeyLabel">Gemini API Key</label>
        <div class="input-row">
          <input type="password" id="apiKey" placeholder="Nhập API key tương ứng" autocomplete="off">
          <button class="btn-icon" id="toggleKey" title="Hiện/Ẩn">👁</button>
        </div>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="help-link" id="helpLink">Lấy API key miễn phí →</a>
      </div>
      <div class="form-group">
        <label for="model">AI Model</label>
        <select id="model">
          <option value="gemini-3.5-flash">Gemini 3.5 Flash (Khuyên dùng - Ổn định)</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (Siêu tốc &amp; Tiết kiệm)</option>
          <option value="gemini-3.6-flash">Gemini 3.6 Flash (Nhanh)</option>
          <option value="gemini-3.7-flash">Gemini 3.7 Flash (Thông minh)</option>
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (Mới nhất)</option>
        </select>
      </div>
    </section>

    <section class="popup-section">
      <h2 class="section-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Local Source Cache
      </h2>
      <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; margin-top: 6px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <span style="font-size: 11.5px; color: #94a3b8;" id="sourceStats">Đang tải kho Source...</span>
          <div style="display: flex; gap: 6px;">
            <input type="file" id="importFileInput" accept=".json" style="display:none;">
            <button type="button" id="importSourceBtn" style="background: rgba(56,189,248,0.15); border: 1px solid rgba(56,189,248,0.3); color: #7dd3fc; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;">Nhập JSON</button>
            <button type="button" id="exportSourceBtn" style="background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); color: #d8b4fe; font-size: 11px; padding: 4px 8px; border-radius: 6px; cursor: pointer;">Xuất JSON</button>
          </div>
        </div>
      </div>
    </section>

    <section class="popup-section">
      <h2 class="section-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Options
      </h2>
      <div class="toggle-group">
        <label class="toggle">
          <input type="checkbox" id="autoSubmitQuiz">
          <span class="toggle-slider"></span>
          <span class="toggle-label">Auto submit quiz after filling</span>
        </label>
      </div>
    </section>

    <section class="popup-section">
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Checking...</span>
      </div>
      <button class="btn-primary" id="saveBtn">Save Settings</button>
    </section>

    <footer class="popup-footer">
      <a href="https://www.coursera.org" target="_blank">Open Coursera</a>
      <span>·</span>
      <span>Educational use only</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
